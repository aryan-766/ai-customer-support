; ============================================================================
; Asterisk SIP Configuration for SAN Software Trunk
; ============================================================================
;
; File: /etc/asterisk/sip.conf
;
; SAN Software SIP trunk Asterisk mein register karne ke liye.
; Actual values apne SAN Software admin se confirm karo.
; ============================================================================

[general]
context=default
allowguest=no
nat=force_rport,comedia
videosupport=no
; Audio codecs — SAN Software typically G.711 use karta hai
disallow=all
allow=ulaw
allow=alaw

; ── SAN Software SIP Trunk ───────────────────────────────────────────────────
[san-software-trunk]
type=peer
host=<SAN_SOFTWARE_IP>         ; SAN Software server ka IP address
port=5060                       ; SIP port (default 5060)
username=<SAN_USERNAME>         ; SAN Software ne diya hua username
secret=<SAN_PASSWORD>           ; SAN Software ne diya hua password
fromuser=<SAN_USERNAME>
fromdomain=<SAN_SOFTWARE_DOMAIN>
insecure=port,invite
qualify=yes
disallow=all
allow=ulaw
allow=alaw
context=from-san-software       ; Inbound calls yahan jaenge (extensions.conf)
dtmfmode=rfc2833                ; DTMF mode

; ── Outbound Dial Rules (agar zaroorat ho) ───────────────────────────────────
; [outbound-san-software]
; type=peer
; host=<SAN_SOFTWARE_IP>
; ...
