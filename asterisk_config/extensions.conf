; ============================================================================
; Asterisk Dialplan — SAN Software SIP → AI Backend Bridge
; ============================================================================
;
; File: /etc/asterisk/extensions.conf  (ya custom include)
;
; Architecture:
;   SAN Software SIP Call
;     → Asterisk [from-san-software] context
;     → HTTP POST to backend (call_id milta hai)
;     → AudioSocket to sip_bridge.py:5000 (audio streaming)
;
; Requirements:
;   - Asterisk 16.x+ (AudioSocket module: chan_audiosocket.so)
;   - func_curl.so loaded (CURL function)
;   - res_http_websocket.so loaded
;
; Check loaded modules:
;   asterisk -rx "module show like chan_audiosocket"
;   asterisk -rx "module show like func_curl"
; ============================================================================

; ── IMPORTANT: Bridge aur Backend IP yahan set karo ──────────────────────────
; SIP Bridge (sip_bridge.py) ka IP aur Port
[globals]
BRIDGE_HOST=localhost
BRIDGE_PORT=5000
BACKEND_URL=http://localhost:8000

; ── Inbound SAN Software calls ───────────────────────────────────────────────
[from-san-software]

; Sabhi inbound extensions handle karo
exten => _X.,1,NoOp(=== Inbound SAN Software Call ===)
 same => n,NoOp(Caller: ${CALLERID(num)}, UniqueID: ${UNIQUEID})

 ; ── Step 1: Backend ko call notify karo, call_id + ws_url receive karo ──────
 same => n,Set(RESPONSE=${CURL(http://localhost:8000/api/v1/sip/san-software/incoming,{"caller_id":"${CALLERID(num)}","uniqueid":"${UNIQUEID}","channel":"${CHANNEL}","exten":"${EXTEN}","context":"${CONTEXT}"})})
 same => n,NoOp(Backend Response: ${RESPONSE})

 ; ── Step 2: call_id parse karo response se (JSON) ───────────────────────────
 ; Response: {"status":"success","call_id":"uuid-here","ws_url":"..."}
 ; Asterisk mein JSON parse ke liye REGEX use karte hain
 same => n,Set(CALL_ID=${REGEX("call_id\":\"([a-f0-9-]+)" ${RESPONSE} 1)})
 same => n,NoOp(Parsed Call ID: ${CALL_ID})

 ; Agar call_id nahi mila toh error handle karo
 same => n,GotoIf($["${CALL_ID}" = ""]?call_failed)

 ; ── Step 3: AudioSocket se AI Bridge se connect karo ────────────────────────
 ; AudioSocket(host:port, UUID)
 ; UUID ke roop mein CALL_ID pass karte hain
 same => n,AudioSocket(localhost:5000,${CALL_ID})

 ; ── Step 4: Call khatam hone pe cleanup ─────────────────────────────────────
 same => n,Set(IGNORE=${CURL(http://localhost:8000/api/v1/sip/san-software/hangup,{"call_id":"${CALL_ID}","uniqueid":"${UNIQUEID}","cause":"${HANGUPCAUSE}"})})
 same => n,Hangup()

; Error handling
exten => call_failed,1,NoOp(Call setup failed - no call_id received)
 same => n,Playback(tt-weasels)
 same => n,Hangup()

; Hangup extension (h = hangup handler)
exten => h,1,NoOp(Call ${CALL_ID} ended, cause: ${HANGUPCAUSE})
 same => n,GotoIf($["${CALL_ID}" = ""]?skip_notify)
 same => n,Set(IGNORE=${CURL(http://localhost:8000/api/v1/sip/san-software/hangup,{"call_id":"${CALL_ID}","uniqueid":"${UNIQUEID}","cause":"${HANGUPCAUSE}"})})
exten => h,n(skip_notify),NoOp(Hangup complete)


; ── DTMF handling (optional) ─────────────────────────────────────────────────
; Agar DTMF digits backend ko bhejne hain:
[from-san-software-dtmf]
exten => _X.,1,Read(DTMF_DIGIT,beep,1)
 same => n,Set(IGNORE=${CURL(http://localhost:8000/api/v1/sip/san-software/dtmf,{"call_id":"${CALL_ID}","digit":"${DTMF_DIGIT}"})})
 same => n,Hangup()
