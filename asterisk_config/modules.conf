; ============================================================================
; Asterisk Modules — SIP Bridge ke liye Required Modules
; ============================================================================
;
; File: /etc/asterisk/modules.conf
;
; Yeh modules LOAD hone chahiye sip_bridge ke saath kaam karne ke liye.
; ============================================================================

[modules]
autoload=yes

; ── AudioSocket (Main requirement) ──────────────────────────────────────────
; Asterisk 16.x+ mein available
; check: asterisk -rx "module show like audiosocket"
load => chan_audiosocket.so

; ── CURL function (HTTP POST to backend) ─────────────────────────────────────
load => func_curl.so
load => res_curl.so

; ── SIP Channel ──────────────────────────────────────────────────────────────
load => chan_sip.so
; Ya PJSIP (newer):
; load => chan_pjsip.so
; load => res_pjsip.so

; ── REGEX function (JSON parsing in dialplan) ────────────────────────────────
load => func_strings.so

; ── Codecs ───────────────────────────────────────────────────────────────────
load => codec_ulaw.so
load => codec_alaw.so
