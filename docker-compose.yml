version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Ambrane AI Voice Support — Docker Compose
# RAM Budget: ~6 GB total (fits 8 GB laptop)
# Run: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL — Main Database ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ambrane_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ambrane_support}
      POSTGRES_USER: ${POSTGRES_USER:-ambrane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambrane_secret_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ambrane} -d ${POSTGRES_DB:-ambrane_support}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis — Cache + Pub/Sub + Sessions ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ambrane_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M

  # ── Qdrant — Vector Database for RAG ───────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.4
    container_name: ambrane_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: WARN
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Ollama — Local LLM Server (Qwen2.5 3B) ─────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ambrane_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: 5m
    deploy:
      resources:
        limits:
          memory: 4G    # Qwen2.5 3B Q4_K_M = ~2.2 GB

  # ── Backend — FastAPI Application ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ambrane_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ambrane}:${POSTGRES_PASSWORD:-ambrane_secret_password}@postgres:5432/${POSTGRES_DB:-ambrane_support}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      LLM_BASE_URL: http://ollama:11434
    volumes:
      - ./backend:/app
      - ./knowledge:/app/knowledge:ro
      - model_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G

  # ── Frontend — Next.js Dashboard ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ambrane_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  model_cache:
